name: CI

on:
  push:
    branches:
      - main
      - "ciclo-**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: Frontend (Lint · Typecheck · Vitest · Vite Build)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Typecheck (TypeScript)
        run: npm run typecheck

      - name: Unit & UI Tests (Vitest)
        run: npm test

      - name: Build Frontend Bundle
        run: npm run build

  rust-and-desktop:
    name: Rust & Desktop (Fmt · Clippy · Tests · Tauri Build)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry & target
        uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies & build dist
        run: |
          npm ci
          npm run build

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy (-D warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Rust unit, security & cross-process tests
        run: cargo test --workspace

      - name: Build Tauri desktop application
        run: npx tauri build --bundles nsis
